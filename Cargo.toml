[package]
name = "center2"
description = "Stata plugin (SPI 3.0) behind center2, a fast drop-in replacement for SSC center"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Leo Liu <auleo.liu@gmail.com>"]
repository = "https://github.com/leoliu0/center2"
publish = false

[lib]
name = "center2"
crate-type = ["cdylib"]

[build-dependencies]
cc = "1"

# Shipped plugin and benchmarks: maximum optimisation.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
